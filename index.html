<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aula de Santi</title>
  <meta name="theme-color" content="#f08a24">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="top">
    <a href="#/" class="brand" aria-label="Inicio">
      <span class="brand-lince" id="brandLince"></span>
      <span class="brand-text">Aula de <b>Santi</b></span>
    </a>
    <div class="stats">
      <span class="pill" title="Días seguidos estudiando">🔥 <b id="racha">0</b></span>
      <span class="pill" title="Estrellas ganadas">⭐ <b id="estrellas">0</b></span>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="bottom">
    <a href="#/" data-nav="inicio"><span>🏠</span>Inicio</a>
    <a href="#/deberes" data-nav="deberes"><span>✏️</span>Deberes</a>
    <a href="#/examenes" data-nav="examenes"><span>📝</span>Exámenes</a>
    <a href="#/errores" data-nav="errores"><span>🔁</span>Repasar</a>
    <a href="#/padres" data-nav="padres"><span>👨‍👦</span>Papá</a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- El cargador trae estilos, contenidos y motor (lo comparten las aulas de otros alumnos) -->
  <script src="cargador.js"></script>
</body>
</html>
